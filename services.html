<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les soins — Eloïse Werle</title>
<meta name="description" content="Massages thaï, balinais, deep tissue, drainage lymphatique, ayurvédique et yoga personnalisé. Détail des soins et de leurs bienfaits.">
<link rel="canonical" href="https://eloisewerle.com/services.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://eloisewerle.com/services.html">
<meta property="og:image" content="https://eloisewerle.com/assets/thai-parc.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/components.css">
<style>
.page-hero{ padding-top: clamp(48px,8vw,96px); padding-bottom: clamp(36px,5vw,60px); }
.page-hero .inner{ max-width: 60ch; }
.page-hero h1{ font-family:var(--display); font-weight:400; font-size:clamp(2.4rem,5.4vw,4.4rem);
  line-height:1.04; margin:16px 0 22px; }
.page-hero p{ color:var(--ink-2); font-size:clamp(1.06rem,1.6vw,1.28rem); max-width:52ch; }
.jump{ display:flex; gap:10px; flex-wrap:wrap; margin-top:30px; }
.jump a{ padding:9px 18px; border:1px solid var(--line); border-radius:999px; font-size:.86rem; font-weight:600;
  color:var(--ink-2); transition:.3s; }
.jump a:hover{ border-color:var(--accent); color:var(--accent); }

.svc-detail{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(32px,6vw,84px); align-items:center;
  padding-block: clamp(48px,7vw,96px); scroll-margin-top:90px; }
.svc-detail + .svc-detail{ border-top:1px solid var(--line); }
.svc-detail__media{ position:relative; aspect-ratio:4/4.6; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-soft); }
.svc-detail--rev .svc-detail__media{ order:2; }
.svc-detail__media img{ width:100%; height:100%; object-fit:cover; }
.svc-detail__media .num{ position:absolute; top:18px; left:20px; font-family:var(--display); font-style:italic;
  color:#FBF5ED; font-size:1.1rem; text-shadow:0 2px 14px rgba(0,0,0,.4); }
.svc-detail h2{ font-family:var(--display); font-weight:400; font-size:clamp(2rem,4vw,3rem); line-height:1.06; margin:10px 0 18px; }
.svc-detail .tag{ font-size:.74rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; }
.svc-detail .long{ color:var(--ink-2); font-size:1.06rem; }
.variants{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
.variants span{ padding:7px 14px; background:var(--cream-2); border-radius:999px; font-size:.82rem; color:var(--ink-2); }
.ben-label{ font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin:26px 0 12px; }
.ben-list{ display:grid; gap:11px; }
.ben-list li{ position:relative; padding-left:26px; color:var(--ink); font-size:1rem; }
.ben-list li::before{ content:''; position:absolute; left:0; top:8px; width:8px; height:8px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
.ben-list--check li::before{ display:none; }
.ben-list--check li{ padding-left:22px; }
.ben-list--check li::after{ content:'✔'; position:absolute; left:0; top:0; color:var(--accent); font-size:.88rem; }
.note{ margin-top:16px; font-size:.9rem; color:var(--ink-2); font-style:italic; }
.price-row{ margin-top:28px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.price-row .p{ font-family:var(--display); font-size:1.55rem; }
.price-row .p small{ font-family:var(--body); font-size:.84rem; color:var(--ink-2); }

/* benefits band */
.benband-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(16px,2vw,26px) clamp(28px,4vw,56px);
  margin-top:clamp(34px,5vw,52px); }
@media (max-width:680px){ .benband-grid{ grid-template-columns:1fr; } }
.benband-item{ display:flex; gap:16px; align-items:baseline; border-top:1px solid rgba(244,242,230,.25); padding-top:16px; }
.benband-item .i{ font-family:var(--display); font-style:italic; opacity:.7; font-size:.95rem; min-width:1.6em; }
.benband-item p{ font-size:1.04rem; opacity:.95; }

/* pricing */
.price-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,2vw,24px); }
@media (max-width:760px){ .price-grid{ grid-template-columns:1fr; } }
.price-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(26px,3vw,38px);
  display:flex; flex-direction:column; gap:8px; transition:.4s; }
.price-card:hover{ border-color:var(--accent-soft); transform:translateY(-5px); box-shadow:var(--shadow-soft); }
.price-card h3{ font-family:var(--body); font-weight:700; font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
.price-card .amt{ font-family:var(--display); font-size:clamp(2.4rem,4vw,3.2rem); line-height:1; margin-top:8px; }
.price-card .amt small{ font-family:var(--body); font-size:.9rem; color:var(--ink-2); letter-spacing:0; }
.price-card .d{ color:var(--ink-2); font-size:.95rem; margin-top:4px; }

/* category section */
.svc-cat-section { padding-top: clamp(36px,5vw,64px); }
.svc-cat-section + .svc-cat-section { border-top: 2px solid var(--line); }
.svc-cat-header { display:flex; align-items:center; gap:16px; margin-bottom:clamp(8px,2vw,16px); }
.svc-cat-header h2 { font-family:var(--body); font-weight:700; font-size:.74rem; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:0; }
.svc-cat-header hr { flex:1; border:none; border-top:1px solid var(--line); }
.svc-cat-section .svc-detail:first-of-type { padding-top: clamp(24px,3vw,40px); }

@media (max-width:860px){
  .svc-detail{ grid-template-columns:1fr; }
  .svc-detail--rev .svc-detail__media{ order:0; }
  .svc-detail__media{ aspect-ratio:4/3.4; max-width:560px; }
}
</style>
</head>
<body data-page="services" data-theme="light" data-anim="subtle">

<main>
  <!-- HERO -->
  <section class="page-hero bg-cream2" data-screen-label="Services — en-tête">
    <div class="wrap">
      <div class="inner reveal">
        <span class="eyebrow" data-i18n="sv.hero.eyebrow">Les soins</span>
        <h1 data-i18n="sv.hero.title">Des soins pensés pour votre corps et votre esprit.</h1>
        <p data-i18n="sv.hero.text">Massages thérapeutiques et yoga personnalisé. Chaque séance s’adapte à vos besoins du moment.</p>
        <div class="jump">
          <a href="#cat-massage" data-i18n="sv.hero.jump.massage">Massages</a>
          <a href="#cat-drainage" data-i18n="sv.hero.jump.drainage">Drainage</a>
          <a href="#cat-yoga" data-i18n="sv.hero.jump.yoga">Yoga</a>
        </div>
      </div>
    </div>
  </section>

  <!-- SERVICE BLOCKS — rendered dynamically from EWStore -->
  <div class="wrap" id="services-root"></div>

  <!-- BENEFITS BAND -->
  <section class="section bg-clay" data-screen-label="Services — bienfaits">
    <div class="wrap">
      <div class="head reveal" style="max-width:30ch">
        <span class="eyebrow" data-i18n="sv.ben.eyebrow">Les bienfaits du massage</span>
        <h2 style="font-size:clamp(2rem,4.4vw,3.4rem)" data-i18n="sv.ben.title">Ce que le toucher répare en vous.</h2>
      </div>
      <div class="benband-grid">
        <div class="benband-item reveal"><span class="i">01</span><p data-i18n="sv.ben.1"></p></div>
        <div class="benband-item reveal" data-d="1"><span class="i">02</span><p data-i18n="sv.ben.2"></p></div>
        <div class="benband-item reveal"><span class="i">03</span><p data-i18n="sv.ben.3"></p></div>
        <div class="benband-item reveal" data-d="1"><span class="i">04</span><p data-i18n="sv.ben.4"></p></div>
        <div class="benband-item reveal"><span class="i">05</span><p data-i18n="sv.ben.5"></p></div>
        <div class="benband-item reveal" data-d="1"><span class="i">06</span><p data-i18n="sv.ben.6"></p></div>
      </div>
    </div>
  </section>


</main>

<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/strings-common.js"></script>
<script src="js/strings-admin.js"></script>
<script src="js/strings-home.js"></script>
<script src="js/strings-services.js"></script>
<script src="js/i18n.js"></script>
<script src="js/site.js"></script>
<script src="js/inline-edit.js"></script>
<script src="js/tweaks.js"></script>
<script>
(function () {
  'use strict';

  var CAT_ORDER = ['massage', 'drainage', 'yoga'];
  var CAT_I18N  = { massage: 'rv.cat.massage', drainage: 'rv.cat.drainage', yoga: 'rv.cat.yoga' };

  function esc(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  function renderServices() {
    var root = document.getElementById('services-root');
    if (!root || !window.EWStore || !window.t) return;
    var EWS = window.EWStore;
    var T = window.t;
    var services = EWS.publishedServices();

    function benSection(label, items) {
      if (!items || !items.length) return '';
      return '<div class="ben-label">' + esc(label) + '</div>' +
        '<ul class="ben-list">' + items.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>';
    }

    function svcCard(s, idxInCat) {
      var id = s.id;
      var rev = idxInCat % 2 === 1 ? ' svc-detail--rev' : '';
      var img = EWS.serviceImg(id);
      var tag = EWS.serviceTag(id);
      var name = EWS.serviceName(id);
      var desc = EWS.serviceDescription(id);
      var note = EWS.serviceNote ? EWS.serviceNote(id) : '';
      var benPhys = EWS.serviceBenefitsPhysical ? EWS.serviceBenefitsPhysical(id) : [];
      var benEmot = EWS.serviceBenefitsEmotional ? EWS.serviceBenefitsEmotional(id) : [];
      var idealFor = EWS.serviceIdealFor ? EWS.serviceIdealFor(id) : [];
      var durations = EWS.serviceDurations(id);
      var options = EWS.serviceOptions ? EWS.serviceOptions(id) : [];
      var durHtml = durations.length
        ? '<div class="variants">' + durations.map(function(d){ return '<span>' + d.min + ' min — ' + d.price + ' €</span>'; }).join('') + '</div>'
        : '';
      var optsHtml = options.length
        ? '<div class="variants">' + options.map(function(o){ return '<span>' + esc(o) + '</span>'; }).join('') + '</div>'
        : '';
      var noteHtml = note ? '<p class="note">' + esc(note) + '</p>' : '';
      var pack = EWS.servicePack ? EWS.servicePack(id) : null;
      var packHtml = pack
        ? '<div class="pack-promo"><span class="pack-promo__badge">' + esc(T('sv.pack.badge') || 'Offre pack') + '</span>' +
          '<span>' + esc((T('sv.pack.text') || '{n} séances : {price}€ au lieu de {regular}€')
            .replace('{n}', pack.sessions).replace('{price}', pack.price).replace('{regular}', pack.regularPrice)) + '</span></div>'
        : '';
      return '<article class="svc-detail' + rev + '" id="' + id + '">' +
        '<div class="svc-detail__media reveal" data-svc-img="' + id + '">' +
          '<img src="' + esc(img) + '" alt="' + esc(name) + '"></div>' +
        '<div class="reveal" data-d="1">' +
          '<span class="tag" data-svc-id="' + id + '" data-svc-field="tag">' + esc(tag) + '</span>' +
          '<h2 data-svc-id="' + id + '" data-svc-field="name">' + esc(name) + '</h2>' +
          (desc ? '<p class="long" data-svc-id="' + id + '" data-svc-field="description">' + esc(desc) + '</p>' : '') +
          noteHtml +
          benSection(T('sv.ben.physical') || 'Bienfaits physiques', benPhys) +
          benSection(T('sv.ben.emotional') || 'Bienfaits émotionnels & énergétiques', benEmot) +
          (idealFor.length
            ? '<div class="ben-label">' + esc(T('sv.ben.idealfor') || 'Idéal pour') + '</div>' +
              '<ul class="ben-list ben-list--check">' + idealFor.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>'
            : '') +
          durHtml + optsHtml + packHtml +
          '<div class="price-row">' +
            '<a class="btn btn-primary" href="reservation.html?service=' + id + '">' + esc(T('cta.book.this')) + '</a>' +
          '</div>' +
        '</div></article>';
    }

    /* group by category in display order */
    var grouped = {};
    services.forEach(function(s) { var c = s.category || 'massage'; if (!grouped[c]) grouped[c] = []; grouped[c].push(s); });
    var seen = new Set();
    var cats = [];
    CAT_ORDER.forEach(function(c) { if (grouped[c]) { cats.push(c); seen.add(c); } });
    Object.keys(grouped).forEach(function(c) { if (!seen.has(c)) cats.push(c); });

    var html = cats.map(function(c) {
      var label = CAT_I18N[c] ? T(CAT_I18N[c]) : c;
      var cards = grouped[c].map(svcCard).join('');
      return '<section class="svc-cat-section" id="cat-' + c + '">' +
        '<div class="svc-cat-header"><h2>' + esc(label) + '</h2><hr></div>' +
        cards +
        '</section>';
    }).join('');

    root.innerHTML = html;
    if (window.ewObserveReveals) window.ewObserveReveals();
  }

  window.addEventListener('ew:datachange', renderServices);
  window.addEventListener('ew:langchange', renderServices);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderServices);
  } else {
    renderServices();
  }
})();
</script>
</body>
</html>
